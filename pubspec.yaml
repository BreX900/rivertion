name: rivertion
description: A Flutter state management library that bridges the gap between traditional state holders and a modern, reactive consumption model.
version: 5.0.1
homepage: https://github.com/BreX900/mek-packages/tree/main/rivertion

environment:
  sdk: ^3.10.0
  flutter: '>=3.32.0'

scripts:
  publish: dart run tool/generate_templates.dart && dart format . && dart pub publish

dependencies:
  flutter: { sdk: flutter }

  meta: ^1.14.0
  args: ^2.5.0
  riverpod: ^3.2.1

dev_dependencies:
  flutter_lints: ^6.0.0

  path: ^1.9.1
  recase: ^4.1.0

  collection: ^1.19.1
  flutter_riverpod: ^3.0.3
  reactive_forms: ^18.2.0
  bloc: ^9.1.0

  flutter_test: { sdk: flutter }
  mocktail: ^1.0.4

